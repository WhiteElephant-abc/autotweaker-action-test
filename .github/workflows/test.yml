name: Test

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Task the agent should complete
        required: true
        type: string

# permissions are job-wide, so the agent step can technically reach this token as
# well. Only the Create PR step actually uses it.
permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Run agent
        uses: AutoTweaker/action@v1
        with:
          prompt: ${{ inputs.prompt }}
          api-key: ${{ secrets.AUTOTWEAKER_API_KEY }}
          provider-type: deepseek
          model-id: deepseek-flash

      - name: Show changes
        if: always()
        run: git status --short

      - name: Create PR
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          set -euo pipefail

          base="${GITHUB_REF_NAME}"
          branch="autotweaker/run-${GITHUB_RUN_ID}"
          title="AutoTweaker: ${PROMPT%%$'\n'*}"
          title="${title:0:60}"

          # The agent may have committed on its own; staging first covers both cases,
          # and the comparison against the base catches whatever it already committed.
          git add -A
          if git diff --cached --quiet && git diff --quiet "origin/${base}" HEAD; then
            echo "::error::The agent left no changes against ${base}."
            exit 1
          fi

          git checkout -b "${branch}"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "${title}"
          fi

          git push -u origin "${branch}"

          body="${RUNNER_TEMP}/pr-body.md"
          {
            printf 'Generated by [AutoTweaker](https://github.com/AutoTweaker/action) in [run %s](%s/%s/actions/runs/%s).\n\n' \
              "${GITHUB_RUN_ID}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
            printf '## Task\n\n'
            printf '%s\n' "${PROMPT}" | sed 's/^/    /'
            printf '\n## Changes\n\n'
            git diff --stat "origin/${base}" HEAD | sed 's/^/    /'
          } > "${body}"

          gh pr create \
            --base "${base}" \
            --head "${branch}" \
            --title "${title}" \
            --body-file "${body}"
