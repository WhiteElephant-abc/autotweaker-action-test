name: Test

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Task the agent should complete
        required: true
        type: string

# permissions are job-wide, so the agent step runs under the same GITHUB_TOKEN.
# It cannot reach it though: the checkout below does not persist it into git
# config, and the token is only handed to the step that needs it.
permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          # Leaves no credentials in .git/config for the agent to find.
          persist-credentials: false

      # The agent writes the commit, so the identity has to exist before it runs.
      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Run agent
        uses: AutoTweaker/action@43e0ad982fb66d95b8644ea847894e8bb4b8b7ae
        with:
          prompt: |
            ${{ inputs.prompt }}

            When the task is complete, commit everything you changed with a concise
            commit message describing the change. Do not push.
          api-key: ${{ secrets.AUTOTWEAKER_API_KEY }}
          provider-type: deepseek
          model-id: deepseek-flash
          plugin-urls: |
            https://github.com/WhiteElephant-abc/autotweaker-action-test/releases/download/v0.1.0/plugin-a-0.1.0.jar
            https://github.com/WhiteElephant-abc/autotweaker-action-test/releases/download/v0.1.0/plugin-b-0.1.0.jar

      - name: Show changes
        if: always()
        run: git status --short

      # create-pull-request commits the workspace changes itself, but the title has
      # to come from the agent's own commit, so it is read before the action runs.
      - name: Prepare PR metadata
        if: success()
        id: meta
        env:
          TASK: ${{ inputs.prompt }}
        run: |
          set -euo pipefail

          # A clean tree means the agent committed, and its message describes the work.
          if git diff --quiet && git diff --cached --quiet; then
            title=$(git log -1 --format=%s)
          else
            title='AutoTweaker: automated changes'
          fi
          printf 'title=%s\n' "${title}" >> "${GITHUB_OUTPUT}"

          body="${RUNNER_TEMP}/pr-body.md"
          {
            printf 'Generated by [AutoTweaker](https://github.com/AutoTweaker/action) in [run %s](%s/%s/actions/runs/%s).\n\n' \
              "${GITHUB_RUN_ID}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
            printf '## Task\n\n'
            printf '%s\n' "${TASK}" | sed 's/^/    /'
          } > "${body}"

      - name: Create Pull Request
        if: success()
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          # GITHUB_RUN_ID is stable across re-runs, the attempt is what changes.
          branch: autotweaker/run-${{ github.run_id }}-${{ github.run_attempt }}
          title: ${{ steps.meta.outputs.title }}
          commit-message: ${{ steps.meta.outputs.title }}
          body-path: ${{ runner.temp }}/pr-body.md
