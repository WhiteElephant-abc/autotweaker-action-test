name: Test

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Task the agent should complete
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: AutoTweaker/action@v1
        with:
          prompt: ${{ inputs.prompt }}
          api-key: ${{ secrets.AUTOTWEAKER_API_KEY }}
          provider-type: deepseek
          model-id: deepseek-flash

      - name: Changes
        if: always()
        run: git status --short
