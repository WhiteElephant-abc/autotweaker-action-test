name: Test

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Task the agent should complete
        required: true
        type: string

# permissions are job-wide, so the agent step runs under the same GITHUB_TOKEN.
# It cannot reach it though: the checkout below does not persist it into git
# config, and GH_TOKEN is scoped to the one step that needs it.
permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          # Leaves no credentials in .git/config for the agent to find.
          persist-credentials: false

      - name: Run agent
        uses: AutoTweaker/action@v1
        with:
          prompt: ${{ inputs.prompt }}
          api-key: ${{ secrets.AUTOTWEAKER_API_KEY }}
          provider-type: deepseek
          model-id: deepseek-flash

      - name: Show changes
        if: always()
        run: git status --short

      - name: Create PR
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          set -euo pipefail

          base="${GITHUB_REF_NAME}"
          # GITHUB_RUN_ID is stable across re-runs, the attempt is what changes.
          branch="autotweaker/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          # The agent may have committed on its own; staging first covers both cases,
          # and the comparison against the base catches whatever it already committed.
          git add -A
          if git diff --cached --quiet && git diff --quiet "origin/${base}" HEAD; then
            echo "::error::The agent left no changes against ${base}."
            exit 1
          fi

          title='AutoTweaker: automated changes'
          git checkout -b "${branch}"
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "${PROMPT}"
            title=$(git log -1 --format=%s)
          fi

          # The checkout persists no credentials, so this one push authenticates
          # itself the same way the checkout would have.
          auth="http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "${auth}" push -u origin "${branch}"

          body="${RUNNER_TEMP}/pr-body.md"
          {
            printf 'Generated by [AutoTweaker](https://github.com/AutoTweaker/action) in [run %s](%s/%s/actions/runs/%s).\n\n' \
              "${GITHUB_RUN_ID}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
            printf '## Task\n\n'
            printf '%s\n' "${PROMPT}" | sed 's/^/    /'
            printf '\n## Changes\n\n'
            git diff --stat "origin/${base}" HEAD | sed 's/^/    /'
          } > "${body}"

          gh pr create \
            --base "${base}" \
            --head "${branch}" \
            --title "${title}" \
            --body-file "${body}"
